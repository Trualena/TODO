services:
  postgres:                  
    image: postgres:16     
    environment:               #натройки базы
      POSTGRES_USER: myuser       
      POSTGRES_PASSWORD: mypassword 
      POSTGRES_DB: todo_db        
    ports:
      - "5432:5432"         
    volumes:
      - pgdata:/var/lib/postgresql/data  #Данные хранить в постоянном томе pgdata

volumes:
  pgdata:               